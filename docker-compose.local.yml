# OPTIONAL. You no longer need this file: docker-compose.yml already publishes the web app on 127.0.0.1:8080, so
# for local use just put the LOCAL block from .env.example into .env and run:   docker compose up --build
#
# This file only sets the local-friendly web settings WITHOUT touching .env. It is an ADD-ON, so it must be used
# together with the main file (using it alone gives: service "bot" has neither an image nor a build context):
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  bot:
    environment:
      WEB_ENABLED: "on"
      WEB_COOKIE_SECURE: "off"            # plain http on localhost
      WEB_TRUST_PROXY: "off"              # nothing in front of the app: never believe X-Forwarded-For
      WEB_PUBLIC_URL: http://localhost:${WEB_LOCAL_PORT:-8080}
