services:
  # Self-hosted Telegram Bot API server.
  # This is what lets CandyDownloader send/receive files up to 2GB
  # instead of the 50MB limit imposed by the public api.telegram.org.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: candy_bot_api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - bot_api_data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"
    # No healthcheck here on purpose: this image is Alpine-based with only
    # openssl/libstdc++ installed - no wget/curl/nc/bash available to run
    # one. Instead, the bot itself retries on startup until this server
    # actually answers (see bot/main.py wait_for_local_api()), which is
    # more reliable than depending on container tooling anyway.

  # PO Token provider - generates the "proof of origin" token YouTube now
  # sometimes demands, without needing any account login/cookies. This is
  # the primary fix for "Sign in to confirm you're not a bot" errors.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: candy_pot_provider
    restart: unless-stopped
    # internal-only, no need to expose to the host

  # Cloudflare WARP as a local SOCKS5 proxy (port 1080, reachable only from the other containers).
  # Sites such as YouTube, X and Instagram block many datacenter/VPS addresses; the bot goes DIRECT first and only
  # routes a site through this when THAT site blocks the server's address (PROXY_DOMAINS lists which sites may;
  # see bot/downloader/proxy.py). The bot does NOT
  # depend on this container: if it is down or fails to start, everything simply goes direct.
  #   - A fresh IP:   docker compose up -d --force-recreate warp     (it registers anew, usually a new address)
  #   - Check it:     docker compose logs warp
  #   - Not wanted:   set YT_PROXY_MODE=off in .env, or `docker compose stop warp`
  warp:
    image: caomingjun/warp:latest
    container_name: candy_warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    device_cgroup_rules:
      - "c 10:200 rwm"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      WARP_SLEEP: 2
    # no published ports and no volume on purpose: no registration is kept between re-creations

  # Lets the bot's admin panel ("WARP > Change address") get a fresh WARP address WITHOUT giving the bot the Docker
  # socket: only this tiny service has it, and it can only re-register and restart the WARP container. It publishes no
  # port. Set WARP_CONTROL_TOKEN in .env (any long random string); leave it empty to switch the button off.
  warp-control:
    image: python:3.12-alpine
    container_name: candy_warp_control
    restart: unless-stopped
    profiles: ["warp-control"]           # off unless you run: docker compose --profile warp-control up -d
    environment:
      WARP_CONTROL_TOKEN: ${WARP_CONTROL_TOKEN:-}
      WARP_CONTAINER: candy_warp
    volumes:
      - ./warp_control/control.py:/control.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-u", "/control.py"]

  # CandyDownloader bot itself.
  bot:
    build: ./bot
    container_name: candy_bot
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
      - bgutil-provider
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      LOCAL_BOT_API_URL: http://telegram-bot-api:8081
      BGUTIL_POT_URL: http://bgutil-provider:4416
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      OWNER_USER_ID: ${OWNER_USER_ID}
      OWNER_NAME: ${OWNER_NAME:-Candy}
      OWNER_EMOJI: ${OWNER_EMOJI:-🍬}
      AUTO_UPDATE_HOUR_UTC: ${AUTO_UPDATE_HOUR_UTC:-4}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
      YT_PROXIES: ${YT_PROXIES:-socks5h://warp:1080}
      YT_PROXY_MODE: ${YT_PROXY_MODE:-auto}
      BURN_MAX_SECONDS: ${BURN_MAX_SECONDS:-3600}
      PROXY_DOMAINS: ${PROXY_DOMAINS:-youtube.com,youtu.be,x.com,twitter.com,instagram.com,pinterest.com,pin.it,reddit.com,tiktok.com}
      PROCESS_NICE: ${PROCESS_NICE:-10}
      WARP_CONTROL_URL: ${WARP_CONTROL_URL:-}
      WARP_CONTROL_TOKEN: ${WARP_CONTROL_TOKEN:-}
      WARP_ROTATE_COOLDOWN_SECONDS: ${WARP_ROTATE_COOLDOWN_SECONDS:-120}
      BOT_API_CLEANUP: ${BOT_API_CLEANUP:-on}
      BOT_API_FILE_MAX_AGE_MINUTES: ${BOT_API_FILE_MAX_AGE_MINUTES:-60}
      HOUSEKEEPING_INTERVAL_SECONDS: ${HOUSEKEEPING_INTERVAL_SECONDS:-300}
      # --- web app (see the caddy service below and .env.example) ---
      WEB_ENABLED: ${WEB_ENABLED:-off}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      WEB_ADMIN_USER: ${WEB_ADMIN_USER:-}
      WEB_ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD:-}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-on}
      WEB_TRUST_PROXY: ${WEB_TRUST_PROXY:-on}
      WEB_FILE_TTL_MINUTES: ${WEB_FILE_TTL_MINUTES:-120}
      WEB_QUOTA_MB: ${WEB_QUOTA_MB:-4096}
      WEB_MAX_ACTIVE_JOBS: ${WEB_MAX_ACTIVE_JOBS:-3}
    # The web app listens on 8080 INSIDE the Docker network only (no `ports:` on purpose): the only way in from the
    # internet is the caddy service, which adds HTTPS. Nothing else about this container is exposed.
    expose:
      - "8080"
    # Keeps a heavy ffmpeg job (converting, exact clip cuts) from taking over your PC. Raise or remove
    # these on a bigger machine; Docker Desktop also has its own CPU/RAM caps under Settings > Resources.
    # The bot runs as PID 1 and starts ffmpeg/aria2c/gallery-dl; without a real init, any child that gets
    # orphaned stays a zombie forever. `init: true` puts Docker's tiny init (tini) in front, which reaps them.
    init: true
    cpus: ${BOT_CPUS:-2}
    mem_limit: ${BOT_MEM_LIMIT:-3g}
    volumes:
      - ./data:/app/data           # per-user settings, small persistent DB
      - ./tmp:/app/tmp             # scratch space for in-progress downloads (auto-cleaned)
      - ./cookies:/app/cookies     # optional per-user cookie files for logged-in sites
      - bot_api_data:/var/lib/telegram-bot-api      # read-write on purpose: the bot deletes the server's copies of files it was sent
    # That last mount is NOT optional, unlike the comment used to say here:
    # with TELEGRAM_LOCAL=1 above, the bot-api server's HTTP file-serving
    # endpoint is switched off entirely, and any file the user sends TO the
    # bot (cookies.txt, and anything else in future) can only be read by
    # reaching directly into the bot-api server's own storage - which is
    # exactly what this shared mount lets python-telegram-bot's
    # download_to_drive() do automatically. It is read-WRITE so the bot can delete those copies again
    # (utils/cleanup.py touches only the documents/videos/audios/... folders, never the server's database).

  # HTTPS front door for the web app: gets and renews a free certificate for WEB_DOMAIN by itself and is the ONLY
  # container with ports open to the internet. Off unless you run: docker compose --profile web up -d
  # Needs: a domain whose DNS points at this machine, and ports 80 and 443 reachable. No domain / ports? Skip this
  # service and use a Cloudflare Tunnel pointing at http://bot:8080 instead (see HANDOFF.md, rev9).
  caddy:
    image: caddy:2-alpine
    container_name: candy_caddy
    restart: unless-stopped
    profiles: ["web"]
    depends_on:
      - bot
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data              # the certificates: keep this volume or you will be asked for new ones
      - caddy_config:/config

volumes:
  bot_api_data:
  caddy_data:
  caddy_config:
