services:
  # Self-hosted Telegram Bot API server.
  # This is what lets CandyDownloader send/receive files up to 2GB
  # instead of the 50MB limit imposed by the public api.telegram.org.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: candy_bot_api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - bot_api_data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"
    # No healthcheck here on purpose: this image is Alpine-based with only
    # openssl/libstdc++ installed - no wget/curl/nc/bash available to run
    # one. Instead, the bot itself retries on startup until this server
    # actually answers (see bot/main.py wait_for_local_api()), which is
    # more reliable than depending on container tooling anyway.

  # PO Token provider - generates the "proof of origin" token YouTube now
  # sometimes demands, without needing any account login/cookies. This is
  # the primary fix for "Sign in to confirm you're not a bot" errors.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: candy_pot_provider
    restart: unless-stopped
    # internal-only, no need to expose to the host

  # Cloudflare WARP as a local SOCKS5 proxy (port 1080, reachable only from the other containers).
  # YouTube blocks most datacenter/VPS addresses; the bot goes DIRECT first and only routes YouTube
  # through this when YouTube blocks the server's address (see bot/downloader/proxy.py). The bot does NOT
  # depend on this container: if it is down or fails to start, everything simply goes direct.
  #   - A fresh IP:   docker compose up -d --force-recreate warp     (it registers anew, usually a new address)
  #   - Check it:     docker compose logs warp
  #   - Not wanted:   set YT_PROXY_MODE=off in .env, or `docker compose stop warp`
  warp:
    image: caomingjun/warp:latest
    container_name: candy_warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    device_cgroup_rules:
      - "c 10:200 rwm"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      WARP_SLEEP: 2
    # no published ports and no volume on purpose: no registration is kept between re-creations

  # CandyDownloader bot itself.
  bot:
    build: ./bot
    container_name: candy_bot
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
      - bgutil-provider
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      LOCAL_BOT_API_URL: http://telegram-bot-api:8081
      BGUTIL_POT_URL: http://bgutil-provider:4416
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      OWNER_USER_ID: ${OWNER_USER_ID}
      OWNER_NAME: ${OWNER_NAME:-Candy}
      OWNER_EMOJI: ${OWNER_EMOJI:-🍬}
      AUTO_UPDATE_HOUR_UTC: ${AUTO_UPDATE_HOUR_UTC:-4}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
      YT_PROXIES: ${YT_PROXIES:-socks5h://warp:1080}
      YT_PROXY_MODE: ${YT_PROXY_MODE:-auto}
      PROCESS_NICE: ${PROCESS_NICE:-10}
    # Keeps a heavy ffmpeg job (converting, exact clip cuts) from taking over your PC. Raise or remove
    # these on a bigger machine; Docker Desktop also has its own CPU/RAM caps under Settings > Resources.
    cpus: ${BOT_CPUS:-2}
    mem_limit: ${BOT_MEM_LIMIT:-3g}
    volumes:
      - ./data:/app/data           # per-user settings, small persistent DB
      - ./tmp:/app/tmp             # scratch space for in-progress downloads (auto-cleaned)
      - ./cookies:/app/cookies     # optional per-user cookie files for logged-in sites
      - bot_api_data:/var/lib/telegram-bot-api:ro
    # That last mount is NOT optional, unlike the comment used to say here:
    # with TELEGRAM_LOCAL=1 above, the bot-api server's HTTP file-serving
    # endpoint is switched off entirely, and any file the user sends TO the
    # bot (cookies.txt, and anything else in future) can only be read by
    # reaching directly into the bot-api server's own storage - which is
    # exactly what this shared, read-only mount lets python-telegram-bot's
    # download_to_drive() do automatically.

volumes:
  bot_api_data:
